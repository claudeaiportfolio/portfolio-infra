name: Security Review

# Two-layer gate via the shared org action: deterministic gitleaks secret scan
# on every push/PR, plus the advisory Claude diff review on PRs.
#
# NB: the previous `claudeaiportfolio/claude-security-review/action@main` ref
# pointed at a repo that doesn't exist — the canonical action lives in
# ai-infra-templates. No path filter, so the secret gate runs on every change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: claudeaiportfolio/ai-infra-templates/action@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-warning: "false"
